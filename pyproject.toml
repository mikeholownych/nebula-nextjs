[project]
name = "nebula-components"
version = "0.1.0"
description = "Nebula Components — audit pipeline, platform API, and automation scripts"
requires-python = ">=3.12"
dependencies = [
    # platform_api core
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "posthog>=3.0.0",
    "joserfc>=1.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "email-validator>=2.0.0",
    # automation / scripts
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "stripe>=10.0.0",
    "python-multipart>=0.0.9",
    "mcp>=1.28.0",
    "fastmcp>=3.4.0",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.0.0",
    "google-analytics-data>=0.23.0",
    "anthropic>=0.120.0",
    "openai>=1.0.0",
    "boto3>=1.43.0",
    "reportlab>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "agentmail>=0.5.0",
    "praw>=7.7.0",
    "playwright>=1.40.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
