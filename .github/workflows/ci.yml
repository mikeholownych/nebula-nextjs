name: CI

on:
  push:
    branches: [main, feature/*, feat/*, fix/*, clay-review/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest-platform-api:
    name: Platform API pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Pytest platform_api
        run: PYTHONPATH=. pytest tests/platform_api -q
        env:
          ENVIRONMENT: development

  # Job 1: Governance validation
  governance:
    name: Governance Register Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: customer-portal/package-lock.json
      - run: npm ci
      - name: Validate governance registers
        run: node scripts/validate-governance.mjs || echo "No governance script"
      - name: Verify evidence atom projection
        run: npm run check:evidence-atoms
      - name: Verify public proof projection
        run: npm run check:public-proof
      - name: Verify intelligence stack projection
        run: npm run check:intelligence-stack
      - name: Claims gate
        run: npm run check:claims
      - name: Analytics governance
        run: npm run check:analytics-governance

  # Job 2: Lint and Typecheck
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: customer-portal/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Storybook content guard
        run: npm run check:content

  # Job 3: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: customer-portal/package-lock.json
      - run: npm ci
      - name: Jest
        # CI-3: floor ratchets upward after first measured baseline; never 0 again.
        run: npm run test -- --passWithNoTests --coverage --coverageThreshold='{"global":{"branches":10,"functions":15,"lines":25,"statements":25}}'
      - name: Storybook content guard
        run: npm run check:content

  # Job 4: Build
  build:
    name: Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: customer-portal/package-lock.json
      - run: npm ci
      - name: Build Next.js
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: customer-portal/.next
          retention-days: 1

  # Job 5: Route-level Lighthouse lab performance budgets
  lighthouse:
    name: Lighthouse CI Lab Performance Budgets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: customer-portal/package-lock.json
      - run: npm ci
      - name: Build production application
        run: npm run build
      - name: Run Lighthouse CI lab measurements
        run: npm run test:performance
      - name: Retain Lighthouse lab reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-lab-reports
          path: customer-portal/lhci-results
          retention-days: 7
          if-no-files-found: warn

  # Job 6: Security audit (advisory - does not block merge)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: customer-portal/package-lock.json
      - run: npm ci
      - name: npm audit (production deps only)
        run: npm audit --omit=dev --audit-level=moderate || true

  # Job 7: Playwright e2e (installs browsers in GH; do not skip with || true)
  e2e:
    name: Playwright e2e
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: customer-portal/package-lock.json
      - run: npm ci
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: customer-portal/.next
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
