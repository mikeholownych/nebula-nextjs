name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: cd customer-portal && npm ci
      - name: Run type check
        run: cd customer-portal && npx tsc --noEmit
      - name: Run tests
        run: cd customer-portal && npm test -- --passWithNoTests

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      NEBULA_SKIP_DB_INIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: cd customer-portal && npm ci
      - name: Build Next.js
        run: cd customer-portal && npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: .next
          path: customer-portal/.next

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: .next
          path: customer-portal/.next
      - name: Deploy to production
        run: |
          echo "Deploying to production server..."
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
