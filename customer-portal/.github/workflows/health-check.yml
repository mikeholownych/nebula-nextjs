name: Health Check

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Check homepage
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" https://nebulacomponents.com/ | grep -q "200"

      - name: Check audit page
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" https://nebulacomponents.com/audit | grep -q "200"

      - name: Check pricing
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" https://nebulacomponents.com/pricing | grep -q "200"

      - name: Check API liveness
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" https://nebulacomponents.com/api/healthz | grep -q "200"

      - name: Check API readiness
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" https://nebulacomponents.com/api/readyz | grep -q "200"

  alert:
    needs: health
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Send alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not configured - skipping notification (configure in repo secrets to enable)"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"text":"Nebula 15-min health check FAILED (nebulacomponents.com) - https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"}' \
            "$ALERT_WEBHOOK_URL" || echo "WARN: webhook delivery failed"
