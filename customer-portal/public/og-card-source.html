<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/styles/nebula-design-system.css">

<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  background: #050505;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  padding: 72px 80px;
  position: relative;
}
.glow {
  position: absolute; top: 90px; right: -80px;
  width: 480px; height: 480px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,194,160,0.28), transparent 70%);
}
.eyebrow { color: #33d4b8; font-size: 18px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 24px; }
h1 { color: #fff; font-size: 62px; line-height: 1.06; letter-spacing: -0.03em; max-width: 860px; margin-bottom: 20px; font-weight: 820; }
h1 em { color: #00c2a0; font-style: normal; }
.sub { color: #9e9e9e; font-size: 23px; max-width: 760px; line-height: 1.4; margin-bottom: 40px; }
.pills { display: flex; gap: 14px; }
.pill { background: #0d1110; border: 1px solid rgba(0,194,160,0.4); color: #d1d5db; font-size: 15px; padding: 9px 18px; border-radius: 999px; }
.logo { position: absolute; bottom: 48px; right: 80px; color: #7c7c7c; font-size: 17px; font-weight: 600; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="eyebrow">Evidence-backed conversion diagnosis</div>
  <h1>Your landing page is <em>leaking buyers.</em></h1>
  <p class="sub">Paste your URL. Get a scored audit across 9 conversion signals. Free evidence-backed report or $97 One-Leak Repair Sprint.</p>
  <div class="pills">
    <div class="pill">🎯 Clarity</div>
    <div class="pill">🖱️ CTA friction</div>
    <div class="pill">🤝 Trust gap</div>
    <div class="pill">📦 Offer specificity</div>
    <div class="pill">🔧 Difficulty</div>
  </div>
  <div class="logo">nebulacomponents.com</div>
</body>
</html>
