# Schema version 2 adds three optional governance fields to each entry:
#
#   signal_source:
#     Where the observation originated.
#     Values: citable | customer_behavior | customer_interview | external_research
#     Default for entries without this field: citable
#
#   demand_state:
#     The current evidence state for this signal relative to Nebula demand validation.
#     Values: not_assessed | observed | pattern | insufficient_data | invalidated
#     Default for entries without this field: not_assessed
#     - not_assessed: No demand assessment has been performed.
#     - observed:     Signal has been observed at least once from an independent source.
#     - pattern:      Signal meets the minimum threshold (3+ independent customers, 2+ sessions).
#     - insufficient_data: Assessment performed; evidence is insufficient for PASS.
#     - invalidated:  Assessment performed; signal is not supported by evidence.
#
#   nebula_commercial_consideration:
#     Whether this signal has entered Nebula's commercialization assessment.
#     Values: none | watching | under_review | declined | admitted
#     Default for entries without this field: none
#     - none:         No commercialization assessment initiated.
#     - watching:     Signal is being monitored for additional observations.
#     - under_review: A gate assessment is in progress (see commercialization-gates.md).
#     - declined:     Gate assessment completed; not commercializing.
#     - admitted:     Gate passed; capability is COMMERCIALIZED.
#
#   observatory_status:
#     Whether this evidence entry may be referenced by published Observatory content.
#     Values: not_applicable | publishing_authorized
#     Default for entries without this field: not_applicable
#     - not_applicable:        This entry is for Citable or internal purposes only.
#                              It may not appear on the Observatory.
#     - publishing_authorized: Mike (founder) has explicitly authorized Observatory
#                              publication of this capability. A PASS gate record must
#                              exist in commercialization-gates.md and an ADR must be
#                              committed before this value is set.
#     CI ENFORCEMENT: PENDING IMPLEMENTATION (I2). Until I2 is implemented, this
#     field is PROCESS-ENFORCED. Do not set publishing_authorized without the
#     required gate record and ADR.
#
# Important invariant: A Citable evidence entry with signal_source: citable
# and nebula_commercial_consideration: none does NOT imply Nebula is considering
# commercialization. Citable evidence entries exist for Citable reasons.
# Only entries that have been explicitly advanced have non-none commercial_consideration.
#
# Do not change the demand_state or nebula_commercial_consideration of an existing entry.
# Append a new entry or add a separate gate record in commercialization-gates.md.

